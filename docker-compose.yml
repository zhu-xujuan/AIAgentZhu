services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiagent-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aiagent123
      POSTGRES_DB: aiagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aiagent-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiagent-backend
    env_file:
      - ./backend/.env.docker
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload
    networks:
      - aiagent-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiagent-frontend
    environment:
      # Use internal backend URL for Next.js rewrites/API routes.
      BACKEND_URL: http://backend:8001
      # Intentionally omit NEXT_PUBLIC_API_URL to use same-origin proxying via rewrites.
    ports:
      - "3000:3000"
      - "3030:3030"
    depends_on:
      - backend
    networks:
      - aiagent-network

volumes:
  postgres_data:

networks:
  aiagent-network:
    driver: bridge
